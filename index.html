<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invite Only</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #000000;
    --panel: #000000;
    --accent: #ffffff;
    --text: #ffffff;
    --muted: #6a6a6a;
    --error: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* ---- Gate screen ---- */
  #gate {
    background: var(--panel);
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    animation: fadeIn 0.5s ease;
  }
  #gate h1 {
    font-size: 22px;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  #gate p.sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 28px;
  }
  #codeInput {
    width: 100%;
    padding: 14px 16px;
    background: #0d0d10;
    border: 1px solid #333;
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
    outline: none;
    transition: border 0.2s;
  }
  #codeInput:focus { border-color: var(--accent); }
  #userInput, #passInput {
    width: 100%;
    padding: 14px 16px;
    background: #0d0d10;
    border: 1px solid #333;
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    margin-bottom: 10px;
    transition: border 0.2s;
  }
  #userInput:focus, #passInput:focus { border-color: var(--accent); }
  #enterBtn {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #000000;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }
  #enterBtn:hover { transform: translateY(-1px); opacity: 0.85; }
  #enterBtn:active { transform: translateY(0); }
  #errorMsg {
    color: var(--error);
    font-size: 13px;
    margin-top: 14px;
    height: 16px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #errorMsg.show { opacity: 1; }
  .shake { animation: shake 0.35s; }
  @keyframes shake {
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- Main site (unlocked content) ---- */
  #site {
    display: none;
    width: 100%;
    max-width: 900px;
    padding: 60px 40px;
    animation: fadeIn 0.6s ease;
  }
  #site h1 { font-size: 32px; margin-bottom: 12px; }
  #site p { color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
  #logoutBtn {
    background: transparent;
    border: 1px solid #333;
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  #logoutBtn:hover { border-color: var(--accent); color: var(--text); }

  #downloadLink {
    position: fixed;
    top: 24px;
    right: 32px;
    color: var(--text);
    font-size: 13px;
    text-decoration: none;
    border-bottom: 1px solid var(--muted);
    padding-bottom: 2px;
    cursor: pointer;
    z-index: 10;
  }
  #downloadLink:hover { border-color: var(--text); opacity: 0.8; }

  #brandLogo {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
    z-index: 10;
    user-select: none;
  }
  #brandLogo .sum { color: #a855f7; }
  #brandLogo .ware { color: #ffffff; }

  /* ---- Forum ---- */
  #site { max-width: 700px; }
  .forum-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    border-bottom: 1px solid #222;
    padding-bottom: 16px;
  }
  .forum-header h1 { font-size: 24px; }
  #newPostBox {
    background: #0a0a0a;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 30px;
  }
  #newPostBox input, #newPostBox textarea {
    width: 100%;
    background: #000;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 10px;
    font-family: inherit;
    outline: none;
  }
  #newPostBox input:focus, #newPostBox textarea:focus { border-color: var(--accent); }
  #newPostBox textarea { resize: vertical; min-height: 70px; }
  #postBtn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  #postBtn:hover { opacity: 0.85; }
  .post {
    border: 1px solid #1f1f1f;
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
    background: #060606;
  }
  .post-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .post-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .post-body { font-size: 14px; color: #ccc; line-height: 1.5; margin-bottom: 12px; white-space: pre-wrap; }
  .replies { margin-left: 12px; padding-left: 14px; border-left: 1px solid #1f1f1f; }
  .reply { font-size: 13px; color: #bbb; margin-bottom: 8px; }
  .reply .reply-meta { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .reply-form { display: flex; gap: 8px; margin-top: 10px; }
  .reply-form input {
    flex: 1;
    background: #000;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    color: var(--text);
    padding: 6px 10px;
    font-size: 13px;
    outline: none;
  }
  .reply-form button {
    background: transparent;
    border: 1px solid #333;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .reply-form button:hover { border-color: var(--accent); color: var(--text); }
  .empty-msg { color: var(--muted); text-align: center; padding: 30px 0; font-size: 13px; }

  /* ---- Tabs & Members ---- */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid #222;
  }
  .tab {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 10px 18px;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text); }
  .member-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #1f1f1f;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: #060606;
  }
  .member-name { font-size: 14px; font-weight: 600; }
  .member-meta { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

  <div id="brandLogo"><span class="sum">sum</span><span class="ware">ware</span></div>

  <!-- GATE -->
  <div id="gate">
    <h1>INSERT INVITE CODE</h1>
    <p class="sub">Enter your details to continue</p>
    <input type="text" id="userInput" placeholder="Username" maxlength="24" autocomplete="off">
    <input type="password" id="passInput" placeholder="Password" maxlength="64" autocomplete="off">
    <input type="text" id="codeInput" placeholder="Invite Code" maxlength="20" autocomplete="off">
    <button id="enterBtn" onclick="tryEnter()">Enter</button>
    <div id="errorMsg">Invalid or expired code</div>
  </div>

  <!-- MAIN SITE (hidden until unlocked) -->
  <div id="site">
    <a id="downloadLink" onclick="downloadForum()">Download</a>
    <div class="forum-header">
      <h1>Forum</h1>
      <button id="logoutBtn" onclick="lock()">Log out</button>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-forum" onclick="showTab('forum')">Forum</button>
      <button class="tab" id="tab-members" onclick="showTab('members')">Members</button>
    </div>

    <div id="forumView">
      <div id="newPostBox">
        <input type="text" id="postTitle" placeholder="Post title" maxlength="80">
        <textarea id="postBody" placeholder="What's on your mind?"></textarea>
        <button id="postBtn" onclick="createPost()">Post</button>
      </div>

      <div id="postsList"></div>
    </div>

    <div id="membersView" style="display:none;">
      <div id="membersList"></div>
    </div>
  </div>

<script>
  /* =========================================================
     EDIT THIS LIST to control who gets in.
     - "code": the string people type in
     - "maxUses": how many different people/devices can use it (set high number for "unlimited")
     - "expires": ISO date string, or null for no expiry
     ========================================================= */
  const INVITE_CODES = [
    { code: "RAVEN-7X2K", maxUses: 1, expires: null },
    { code: "ONYX-91LM",  maxUses: 1, expires: null },
    { code: "GHOST-4QZP", maxUses: 1, expires: null },
    { code: "VOID-88TN",  maxUses: 1, expires: null },
    { code: "CIPHER-3RJ", maxUses: 1, expires: null },
    { code: "SHADE-62WX", maxUses: 1, expires: null },
    { code: "ECHO-15VB",  maxUses: 1, expires: null },
    { code: "NULL-73KD",  maxUses: 1, expires: null },
    { code: "OBSIDIAN-9", maxUses: 1, expires: null },
    { code: "DRIFT-42PC", maxUses: 1, expires: null }
  ];

  const STORAGE_KEY = "invite_site_unlocked"; // holds current logged-in username
  const USAGE_KEY = "invite_site_usage"; // tracks uses per code, stored locally
  const MEMBERS_KEY = "invite_site_members";

  function getUsage() {
    try { return JSON.parse(localStorage.getItem(USAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function saveUsage(usage) {
    localStorage.setItem(USAGE_KEY, JSON.stringify(usage));
  }

  function getMembers() {
    try { return JSON.parse(localStorage.getItem(MEMBERS_KEY)) || []; }
    catch { return []; }
  }

  function saveMembers(members) {
    localStorage.setItem(MEMBERS_KEY, JSON.stringify(members));
  }

  function normalizeCode(str) {
    return str.trim().toUpperCase();
  }

  function validateCode(input) {
    const norm = normalizeCode(input);
    const entry = INVITE_CODES.find(c => normalizeCode(c.code) === norm);
    if (!entry) return { ok: false, reason: "not_found" };

    if (entry.expires) {
      const exp = new Date(entry.expires);
      if (new Date() > exp) return { ok: false, reason: "expired" };
    }

    const usage = getUsage();
    const used = usage[norm] || 0;
    if (used >= entry.maxUses) return { ok: false, reason: "exhausted" };

    return { ok: true, entry, norm, used };
  }

  function showError(msg) {
    const gate = document.getElementById("gate");
    const err = document.getElementById("errorMsg");
    err.textContent = msg;
    err.classList.add("show");
    gate.classList.add("shake");
    setTimeout(() => gate.classList.remove("shake"), 350);
  }

  function tryEnter() {
    const username = document.getElementById("userInput").value.trim();
    const password = document.getElementById("passInput").value;
    const codeRaw = document.getElementById("codeInput").value;

    if (!username || !password) {
      showError("Username and password required");
      return;
    }

    const members = getMembers();
    const existing = members.find(m => m.username.toLowerCase() === username.toLowerCase());

    if (existing) {
      // returning member — password must match, invite code not required
      if (existing.password !== password) {
        showError("Incorrect password");
        return;
      }
      localStorage.setItem(STORAGE_KEY, existing.username);
      unlock();
      return;
    }

    // new member — invite code required
    const result = validateCode(codeRaw);
    if (!result.ok) {
      showError("Invalid or expired invite code");
      return;
    }

    // consume one use of the code
    const usage = getUsage();
    usage[result.norm] = (usage[result.norm] || 0) + 1;
    saveUsage(usage);

    // create the member
    members.push({
      username,
      password,
      joinedAt: Date.now(),
      invitedByCode: result.norm
    });
    saveMembers(members);

    localStorage.setItem(STORAGE_KEY, username);
    unlock();
  }

  function unlock() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("site").style.display = "block";
    renderMembers();
  }

  function lock() {
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById("site").style.display = "none";
    document.getElementById("gate").style.display = "block";
    document.getElementById("codeInput").value = "";
    document.getElementById("userInput").value = "";
    document.getElementById("passInput").value = "";
  }

  // Allow Enter key to submit from any gate field
  ["userInput", "passInput", "codeInput"].forEach(id => {
    document.getElementById(id).addEventListener("keydown", e => {
      if (e.key === "Enter") tryEnter();
    });
  });

  function showTab(name) {
    document.getElementById("tab-forum").classList.toggle("active", name === "forum");
    document.getElementById("tab-members").classList.toggle("active", name === "members");
    document.getElementById("forumView").style.display = name === "forum" ? "block" : "none";
    document.getElementById("membersView").style.display = name === "members" ? "block" : "none";
    if (name === "members") renderMembers();
  }

  function renderMembers() {
    const container = document.getElementById("membersList");
    if (!container) return;
    const members = getMembers();

    if (members.length === 0) {
      container.innerHTML = '<div class="empty-msg">No members yet.</div>';
      return;
    }

    container.innerHTML = members
      .slice()
      .sort((a, b) => a.joinedAt - b.joinedAt)
      .map(m => `
        <div class="member-row">
          <div class="member-name">${escapeHtml(m.username)}</div>
          <div class="member-meta">joined ${timeAgo(m.joinedAt)}</div>
        </div>
      `).join("");
  }

  // Auto-unlock if this device already has a logged-in session
  window.addEventListener("DOMContentLoaded", () => {
    const remembered = localStorage.getItem(STORAGE_KEY);
    if (remembered) {
      const members = getMembers();
      const stillExists = members.find(m => m.username === remembered);
      if (stillExists) unlock();
      else localStorage.removeItem(STORAGE_KEY);
    }
    renderPosts();
  });

  /* ================= FORUM ================= */
  const POSTS_KEY = "forum_posts";

  function getPosts() {
    try { return JSON.parse(localStorage.getItem(POSTS_KEY)) || []; }
    catch { return []; }
  }

  function savePosts(posts) {
    localStorage.setItem(POSTS_KEY, JSON.stringify(posts));
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function timeAgo(ts) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
  }

  function createPost() {
    const title = document.getElementById("postTitle").value.trim();
    const body = document.getElementById("postBody").value.trim();
    if (!title || !body) return;

    const posts = getPosts();
    const whoami = localStorage.getItem(STORAGE_KEY) || "Unknown";
    posts.unshift({
      id: Date.now(),
      title,
      body,
      author: whoami,
      ts: Date.now(),
      replies: []
    });
    savePosts(posts);

    document.getElementById("postTitle").value = "";
    document.getElementById("postBody").value = "";
    renderPosts();
  }

  function addReply(postId) {
    const input = document.getElementById("reply-input-" + postId);
    const text = input.value.trim();
    if (!text) return;

    const posts = getPosts();
    const post = posts.find(p => p.id === postId);
    if (!post) return;

    const whoami = localStorage.getItem(STORAGE_KEY) || "Unknown";
    post.replies.push({ author: whoami, body: text, ts: Date.now() });
    savePosts(posts);
    renderPosts();
  }

  function renderPosts() {
    const container = document.getElementById("postsList");
    if (!container) return;
    const posts = getPosts();

    if (posts.length === 0) {
      container.innerHTML = '<div class="empty-msg">No posts yet. Be the first.</div>';
      return;
    }

    container.innerHTML = posts.map(post => `
      <div class="post">
        <div class="post-title">${escapeHtml(post.title)}</div>
        <div class="post-meta">by ${escapeHtml(post.author)} · ${timeAgo(post.ts)}</div>
        <div class="post-body">${escapeHtml(post.body)}</div>
        <div class="replies">
          ${post.replies.map(r => `
            <div class="reply">
              <div class="reply-meta">${escapeHtml(r.author)} · ${timeAgo(r.ts)}</div>
              ${escapeHtml(r.body)}
            </div>
          `).join("")}
        </div>
        <div class="reply-form">
          <input type="text" id="reply-input-${post.id}" placeholder="Reply...">
          <button onclick="addReply(${post.id})">Reply</button>
        </div>
      </div>
    `).join("");
  }

 function downloadForum() {
    const a = document.createElement("a");

    a.href = "/files/package.zip";
    a.download = "package.zip";

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}


</script>

</body>
</html>
